<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
</head>

<body>
    <header>
        <h1>Las Cinco</h1>
<!--        <nav>
            </nav> -->
    </header>

    <main>
        <h2>Contacto</h2>
        <p>Consultas sobre el colectivo De Fem, investigación o muestras.</p>

<!--Utilizo de referencia el ejemplo de formularios provisto por la cátedra-->
        <form id="formulario" method="post" action="#" novalidate>
            <fieldset>
                <legend>Datos de contacto</legend>

                <div>
                    <label for="nombre">Nombre: *</label>
                    <input type="text" id="nombre" name="nombre" required />
                    <span id="error-nombre" class="mensaje-error"></span>
                </div>

                <div>
                    <label for="email">Email: *</label>
                    <input type="email" id="email" name="email" required />
                    <span id="error-email" class="mensaje-error"></span>
                </div>

                <div>
                    <label for="comentarios">Comentarios: *</label>
                    <textarea id="comentarios" name="comentarios" rows="5" required></textarea>
                    <span id="error-comentarios" class="mensaje-error"></span>
                </div>

                <button type="submit">Enviar</button>
            </fieldset>

            <p id="mensaje-error" role="alert" aria-live="polite"></p>
            <p id="mensaje-exito" role="status" aria-live="polite"></p>
        </form>
    </main>

<!--   <footer>
     </footer> -->

    <script src="js/validacion_contacto.js" defer></script>
</body>

</html>
